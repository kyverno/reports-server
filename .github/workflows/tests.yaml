# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Tests

permissions: {}

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    # - name: Create test cluster
    #   run: |
    #     set -e
    #     make kind-cluster
    - name: Run tests
      run: |
        set -e
        make tests
    - name: Upload Report to Codecov
      uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673 # v4.5.0
      with:
        files: ./coverage.out
        fail_ci_if_error: true
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  required:
    needs:
    - unit-tests
    runs-on: ubuntu-latest
    steps:
    - run: echo "Required jobs success!"

  dependabot-automerge:
    # Dependabot PRs opened in this repository only, not in forks. Runs after
    # the build and unit tests passed.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'kyverno/reports-server'
    needs:
    - required
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
    - name: Fetch Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

    - name: Wait for the other workflows
      if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
      env:
        WORKFLOW_NAME: ${{ github.workflow }}
      run: |
        set -euo pipefail
        # main has no required checks, so wait here until the checks of the
        # other workflows (e2e, lint, codegen, ...) have finished, and stop if
        # one of them failed. Codecov statuses are informational and ignored.
        while true; do
          checks=$(gh pr checks "$PR_NUMBER" --json name,bucket,workflow \
            --jq "[.[] | select(.workflow != \"$WORKFLOW_NAME\" and (.name | startswith(\"codecov/\") | not))]" || true)
          if [ -z "$checks" ] || [ "$checks" = "[]" ]; then
            echo "No checks registered yet"
          else
            failed=$(jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")' <<< "$checks")
            if [ -n "$failed" ]; then
              echo "::error::Checks failed: $failed"
              exit 1
            fi
            pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<< "$checks")
            if [ "$pending" = 0 ]; then
              echo "All other checks passed"
              break
            fi
            echo "Waiting for $pending checks"
          fi
          sleep 60
        done

    - name: Merge patch and minor updates
      if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
      run: gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"
